server {
    listen 80;
    # oauth2-proxy session cookies (large Entra tokens, chunked) are sent to every app on this
    # shared host; the 8k default overflows with "400 Request Header Or Cookie Too Large".
    large_client_header_buffers 4 32k;
    absolute_redirect off;   # /prism -> /prism/ without leaking the internal host/port

    location /prism/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }
}
