# Deploy in Coolify as a "Docker Compose" application.
# Public URL: https://data-insights.perforce.com/prism/ -- the landing page (coolify-landing-page)
# reverse-proxies /prism/ to this app's generated hostname, so keep the Coolify domain for `auth`
# at its generated value (do not set data-insights.perforce.com here) and leave "web" empty.
# The app lives under the /prism path, so nginx, the oauth2-proxy endpoints and the cookie are
# all scoped to /prism (cookie has its own name so it can't clash with other apps on the host).
# Flow: landing nginx -> Traefik -> oauth2-proxy (auth, Entra login) -> nginx (web, internal only).
# Required env vars: ENTRA_TENANT_ID, ENTRA_CLIENT_SECRET, OAUTH2_COOKIE_SECRET.
# In Entra, add https://data-insights.perforce.com/prism/.auth/login/aad/callback as a redirect URI
# on the app registration (or set ENTRA_CLIENT_ID to a dedicated registration).
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    expose:
      - "4180"
    depends_on:
      - web
    environment:
      SERVICE_FQDN_AUTH_4180: /
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID}/v2.0
      # Entra v2.0 tokens often lack `email`; preferred_username is the UPN/email.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID:-0c832e13-c4f0-4d2d-80f8-5b1046a5830d}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_PROXY_PREFIX: /prism/.auth/login/aad
      OAUTH2_PROXY_REDIRECT_URL: https://data-insights.perforce.com/prism/.auth/login/aad/callback
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_proxy_prism
      OAUTH2_PROXY_COOKIE_PATH: /prism
      OAUTH2_PROXY_UPSTREAMS: http://web:80
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: perforce.com
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
