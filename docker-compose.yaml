# Deploy in Coolify as a "Docker Compose" application.
# In the Coolify UI set the domain on the `auth` service ONLY:
#     Domains for auth: https://<your-catalog-hostname>   (no port)
# and leave "Domains for web" empty. The SERVICE_FQDN_AUTH_4180 magic variable below
# tells Coolify to route that domain to port 4180. Coolify generates the Traefik routing.
# Flow: Traefik -> oauth2-proxy (auth, Entra login) -> nginx (web, internal only).
# Required env vars: ENTRA_TENANT_ID, ENTRA_CLIENT_SECRET, OAUTH2_COOKIE_SECRET.
# In Entra, add https://<your-catalog-hostname>/.auth/login/aad/callback as a redirect URI
# on the app registration (or set ENTRA_CLIENT_ID to a dedicated registration).
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    expose:
      - "4180"
    depends_on:
      - web
    environment:
      SERVICE_FQDN_AUTH_4180: /
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID}/v2.0
      # Entra v2.0 tokens often lack `email`; preferred_username is the UPN/email.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID:-0c832e13-c4f0-4d2d-80f8-5b1046a5830d}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET}
      # Same callback prefix as coolify-landing-page (the default /oauth2 is already
      # answered by another oauth2-proxy on the shared host).
      OAUTH2_PROXY_PROXY_PREFIX: /.auth/login/aad
      # Coolify supplies the full https URL of the domain assigned to `auth`.
      OAUTH2_PROXY_REDIRECT_URL: ${SERVICE_URL_AUTH}/.auth/login/aad/callback
      OAUTH2_PROXY_UPSTREAMS: http://web:80
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: perforce.com
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
