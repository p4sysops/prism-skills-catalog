<style>
  :root {
    --font-display:'Gibson','Plus Jakarta Sans',sans-serif;
    --font-body:'Gibson','Plus Jakarta Sans',sans-serif;
    --font-mono:'Space Mono',monospace;
    --s0:#64748b; --s0-bg:rgba(100,116,139,0.08);
    --s1:#2563eb; --s1-bg:rgba(37,99,235,0.08);
    --s2:#d97706; --s2-bg:rgba(217,119,6,0.08);
    --s3:#059669; --s3-bg:rgba(5,150,105,0.08);
    --s4:#7c3aed; --s4-bg:rgba(124,58,237,0.08);
    --teal:#0891b2; --teal-bg:rgba(8,145,178,0.08);
    --pink:#db2777; --pink-bg:rgba(219,39,119,0.08);
    --brand:#0e9e78; --brand-bg:rgba(14,158,120,0.09); --brand-border:rgba(14,158,120,0.28);
    --ok:#059669; --warn:#d97706;
    --bg:#ffffff; --surface:#f8fafc; --surface2:#f1f5f9;
    --text:#1e293b; --muted:#475569; --dim:#94a3b8;
    --border:rgba(0,0,0,0.08);
    --mint:#2fe6b0; --mint-bg:rgba(47,230,176,0.1); --mint-border:rgba(47,230,176,0.3);
    --hero-bg:#0c1230; --hero-border:rgba(255,255,255,0.08); --hero-text:#f5f7fb; --hero-desc:rgba(245,247,251,0.72);
    --hero-glow:radial-gradient(circle at 78% 30%, rgba(47,230,176,0.16), transparent 60%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh}

  .skip-link{position:absolute;left:-9999px;top:0;z-index:100;background:var(--mint);color:#04150f;font-weight:700;padding:0.6rem 1rem;border-radius:0 0 8px 0;text-decoration:none}
  .skip-link:focus{left:0}
  .brand-bg-logo{position:fixed;top:-4vw;right:-3vw;width:34vw;max-width:640px;min-width:340px;aspect-ratio:640/563;background-repeat:no-repeat;background-position:center;background-size:contain;opacity:0;pointer-events:none;z-index:-1;transition:opacity 0.4s ease}
  body.theme-dark .brand-bg-logo{opacity:0.55}
  @media(max-width:900px){ .brand-bg-logo{display:none} }
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  :focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:4px}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important}
  }

  .app-header{position:fixed;top:0;left:0;right:0;height:38px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.5rem;padding:0 1rem;z-index:60;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(248,250,252,0.95);line-height:1}
  .app-header-logo{width:22px;height:22px;flex-shrink:0;color:var(--brand)}
  .app-header-logo svg{width:100%;height:100%;display:block}
  .app-header-title{font-family:var(--font-display);font-size:0.78rem;font-weight:400;color:var(--text);white-space:nowrap;line-height:38px}
  .app-header-sep{color:var(--dim);font-size:0.7rem;line-height:38px}
  .app-header-sub{font-size:0.75rem;color:var(--muted);font-weight:400;line-height:38px}
  .app-header-version{margin-left:auto;font-family:var(--font-mono);font-size:0.62rem;font-weight:400;letter-spacing:0.04em;padding:3px 8px;border-radius:4px;background:var(--brand-bg);color:var(--brand);white-space:nowrap;line-height:1}

  .app-footer{position:fixed;bottom:0;left:0;right:0;height:32px;z-index:60}

  .app-shell{display:flex;min-height:calc(100vh - 70px);margin-top:38px;margin-bottom:32px}
  .sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:38px;height:calc(100vh - 70px);transition:width 0.25s ease,min-width 0.25s ease;overflow:hidden;z-index:50}
  .sidebar.collapsed{width:48px;min-width:48px}
  .sidebar.collapsed .sidebar-label{opacity:0;width:0;overflow:hidden}
  .sidebar.collapsed .sidebar-item{justify-content:center;padding:0.6rem;gap:0}
  .sidebar.collapsed .sidebar-collapse-btn{justify-content:center;padding:0.55rem;gap:0}
  .sidebar.collapsed .sidebar-collapse-icon{transform:rotate(180deg)}
  .sidebar.collapsed .sidebar-divider{margin:0.25rem 0.25rem}
  .sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:0.6rem 0.5rem;flex:1}
  .sidebar-item{display:flex;align-items:center;gap:0.55rem;padding:0.55rem 0.6rem;border-radius:8px;text-decoration:none;color:var(--muted);font-size:0.78rem;font-weight:400;cursor:pointer;transition:all 0.15s;white-space:nowrap;width:100%;text-align:left;background:none;border:none;font-family:var(--font-body)}
  .sidebar-item:hover{background:rgba(0,0,0,0.04);color:var(--text)}
  .sidebar-item.active{background:var(--brand-bg);color:var(--brand);font-weight:400}
  .sidebar-icon{width:18px;height:18px;flex-shrink:0;opacity:0.55}
  .sidebar-item.active .sidebar-icon{opacity:1}
  .sidebar-label{transition:opacity 0.2s;overflow:hidden;white-space:nowrap}
  .sidebar-divider{height:1px;background:var(--border);margin:0.25rem 0.5rem;flex-shrink:0}

// Controlled product list (display names). "All Products" is first.
var PRODUCTS = [
  "All Products",
  "Akana","Components","Gliffy","JRebel","OpenLogic","Zend",
  "P4 Plan","P4","ALM","IPLM",
  "Puppet","Delphix",
  "BlazeMeter","Perfecto",
  "Perforce QAC","Perforce Klocwork"
];

// Groups of products that should be presented as a single bucket in the
// "By Product" tabs (skills still tag their individual product underneath).
var PRODUCT_GROUPS = {
  "Static Analysis": ["Perforce QAC","Perforce Klocwork"]
};
function productGroupFor(p){
  var found = null;
  Object.keys(PRODUCT_GROUPS).forEach(function(g){ if (PRODUCT_GROUPS[g].indexOf(p) !== -1) found = g; });
  return found;
}
function displayProductList(){
  var seen = {}, out = [];
  PRODUCTS.forEach(function(p){
    var group = productGroupFor(p);
    var key = group || p;
    if (seen[key]) return;
    seen[key] = true;
    out.push(key);
  });
  return out;
}

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function statusBadgeCls(s){ return s === 'active' ? 'badge-active' : 'badge-inprogress'; }

function skillInArea(s, key){ return key === 'all' || s.areas.indexOf(key) !== -1; }
function countByStatus(st){ return SKILLS.filter(function(s){ return s.status === st; }).length; }
function skillsForProduct(p){
  if (p === 'All Products') return SKILLS.slice();
  var members = PRODUCT_GROUPS[p];
  if (members) return SKILLS.filter(function(s){ return s.products.some(function(sp){ return members.indexOf(sp) !== -1; }); });
  return SKILLS.filter(function(s){ return s.products.indexOf(p) !== -1; });
}

function syncBySkillTabUI(){
  var areaKey = state.bySkillArea;

  var areaSkills = SKILLS.filter(function(s){ return skillInArea(s, areaKey); });
  var counts = { 'all': areaSkills.length, 'active': areaSkills.filter(function(s){ return s.status === 'active'; }).length, 'in-progress': areaSkills.filter(function(s){ return s.status === 'in-progress'; }).length };
  document.querySelectorAll('#bySkillStatusTabs .area-tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-status') === state.bySkillStatus);
    var countEl = t.querySelector('.count');
    if (countEl) countEl.textContent = counts[t.getAttribute('data-status')];
  });
  var searchEl = document.getElementById('bySkillSearch');
  if (searchEl) searchEl.value = state.bySkillSearch;
}

  }
  if (progressList.length) {
    html += '<div class="status-section"><div class="status-section-label progress-label">In Progress</div><div class="card-grid">' + progressList.map(renderSkillCard).join('') + '</div></div>';
  }
  if (!activeList.length && !progressList.length) {
    html += '<div class="empty-state">No matches' + (q ? ' for &ldquo;' + escapeHtml(q) + '&rdquo;' : '') + '.</div>';
  }
  content.innerHTML = html;
}

function renderSkillCard(s){
  var areaCls = AREA_CLASSES[s.areas[0]] || '';
  var owners = s.captains.map(function(c){ return '<span class="pill-owner">' + escapeHtml(c) + '</span>'; }).join(' ');
  var detail = '';
  if (s.status === 'active') {
    var runs = s.who_runs.map(function(r){ return '<span class="pill-skill">' + escapeHtml(r) + '</span>'; }).join(' ');
    var products = s.products.map(function(p){ var all = p === 'All Products' ? ' all' : ''; return '<span class="pill-product' + all + '">' + escapeHtml(p) + '</span>'; }).join(' ');
    var sources = s.data_sources.length
      ? s.data_sources.map(function(d){ return '<span class="pill-source">' + escapeHtml(d) + '</span>'; }).join(' ')
      : '<span class="pill-source tbd">To be confirmed</span>';
    detail =
      '<h4>Audience</h4><div class="kv-skills">' + runs + '</div>' +
      '<h4>Products</h4><div class="kv-skills">' + products + '</div>' +
      '<h4>Data sources</h4><div class="kv-skills">' + sources + '</div>' +
      '<h4>What it produces</h4><div class="outputs-text">' + escapeHtml(s.outputs) + '</div>' +
      '<h4>Skill Captains</h4><div class="kv-skills">' + owners + '</div>';
  } else {
    detail =
      '<h4>Skill Captain</h4><div class="kv-skills">' + owners + '</div>' +
      '<h4>Expected Launch Date</h4><div class="meta-line"><span>September 18, 2026</span></div>';
  }


  return '<div class="e-card ' + areaCls + '" style="--card-accent:var(--area)">' +
    '<div class="e-card-head">' +
      '<div class="e-card-title-row">' +
        '<div><div class="e-card-title">' + escapeHtml(s.name) + '</div><div class="e-card-friendly">' + escapeHtml(s.friendly) + '</div></div>' +
        '<span class="badge ' + statusBadgeCls(s.status) + '">' + statusLabel(s.status) + '</span>' +
      '</div>' +
      '<div class="e-card-meta">' +
        s.areas.map(function(a){ return '<span class="badge badge-area">' + escapeHtml(deptByKey[a] ? deptByKey[a].name : a) + '</span>'; }).join('') +
        '<span class="badge ' + kindBadgeCls(s.kind) + '">' + escapeHtml(s.kind) + '</span>' +
        '<span class="badge ' + platformBadgeCls(s.platform) + '">' + escapeHtml(s.platform) + '</span>' +
      '</div>' +
      '<div class="e-card-summary">' + escapeHtml(s.summary) + '</div>' +
    '</div>' +
    '<div class="e-card-detail">' + detail + '</div>' +
  '</div>';
}

// --------------------------------- BY PRODUCT ---------------------------------
function buildByProduct(){
  var el = document.getElementById('section-by-product');
  el.innerHTML =
    '<h1 class="page-title">By Product</h1>' +
    '<p class="page-sub">Skills and agents grouped by the Perforce product they currently serve. Select a product to filter \u2014 no more scrolling through every product. Items marked <em>All Products</em> apply across the portfolio.</p>' +
    '<div class="area-tabs area-tabs-compact" id="byProductTabs"></div>' +
    '<div class="view-toolbar"><label for="byProductSearch" class="visually-hidden">Filter by name</label><input type="text" class="search-input" id="byProductSearch" placeholder="Filter by name..." oninput="onByProductSearch(this.value)"></div>' +
    '<div id="byProductContent"></div>';

  var tabsEl = document.getElementById('byProductTabs');
  var productsWithSkills = displayProductList().filter(function(p){ return skillsForProduct(p).length > 0; });
  tabsEl.innerHTML = productsWithSkills.map(function(p){
    var count = skillsForProduct(p).length;
    var members = PRODUCT_GROUPS[p];
    var title = members ? (p + ' (' + members.join(', ') + ')') : p;
    return '<button class="area-tab" data-product="' + escapeHtml(p) + '" title="' + escapeHtml(title) + '" onclick="selectByProductTab(\'' + p.replace(/'/g,"\\'") + '\')"><span class="label">' + escapeHtml(p) + '</span><span class="count">' + count + '</span></button>';
  }).join('');

  syncByProductTabUI();
  renderByProductContent();
}
function syncByProductTabUI(){
  document.querySelectorAll('#byProductTabs .area-tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-product') === state.byProductTab); });
  var searchEl = document.getElementById('byProductSearch');
  if (searchEl) searchEl.value = state.byProductSearch;
}
function selectByProductTab(p){ state.byProductTab = p; syncByProductTabUI(); renderByProductContent(); }
function onByProductSearch(q){ state.byProductSearch = (q||'').toLowerCase(); renderByProductContent(); }

function renderByProductContent(){
  var content = document.getElementById('byProductContent');
  var p = state.byProductTab;
  var q = state.byProductSearch;
  var list = skillsForProduct(p);
  if (q){
    list = list.filter(function(s){ return s.name.toLowerCase().indexOf(q) !== -1 || s.friendly.toLowerCase().indexOf(q) !== -1 || (s.summary||'').toLowerCase().indexOf(q) !== -1 || s.captains.join(' ').toLowerCase().indexOf(q) !== -1; });
  }
  var activeList   = list.filter(function(s){ return s.status === 'active'; });
  var progressList = list.filter(function(s){ return s.status === 'in-progress'; });
  var html = '';
  if (activeList.length) {
    html += '<div class="status-section"><div class="status-section-label active-label">Active</div><div class="card-grid">' + activeList.map(renderSkillCard).join('') + '</div></div>';
  }
  if (progressList.length) {
    html += '<div class="status-section"><div class="status-section-label progress-label">In Progress</div><div class="card-grid">' + progressList.map(renderSkillCard).join('') + '</div></div>';
  }
  if (!html) html = '<div class="empty-state">No skills or agents match this view.</div>';
  content.innerHTML = html;
}

// -------------------------------- NAVIGATION ----------------------------------
var sidebar = document.getElementById('sidebar');
function navigateTo(section, fromHash){
  document.querySelectorAll('.sidebar-item').forEach(function(a){ a.classList.remove('active'); a.removeAttribute('aria-current'); });
  var item = document.querySelector('.sidebar-item[data-section="' + section + '"]');
  if (item) { item.classList.add('active'); item.setAttribute('aria-current','page'); }
  document.querySelectorAll('.section-content').forEach(function(s){ s.classList.remove('active'); });
  var target = document.getElementById('section-' + section);
  if (target) target.classList.add('active');
  if (!rendered[section]){
    rendered[section] = true;
    if (section === 'overview') buildOverview();
    else if (section === 'by-skill') buildBySkill();
    else if (section === 'by-product') buildByProduct();
    else if (section === 'request') buildRequest();
    else if (section === 'idea') buildIdea();

  }
  window.scrollTo(0,0);
  if (sidebar.classList.contains('mobile-open')) toggleMobileSidebar();
  if (!fromHash) { try { history.pushState(null, null, '#' + section); } catch (e) { /* sandboxed/null-origin context: ignore */ } }
}
function toggleSidebar(){
  var collapseBtn = document.querySelector('.sidebar-collapse-btn');
  if (window.innerWidth <= 768){
    sidebar.classList.toggle('mobile-open');
    document.getElementById('mobileBackdrop').classList.toggle('active');
    var hamburger = document.querySelector('.mobile-hamburger');
    if (hamburger) hamburger.setAttribute('aria-expanded', sidebar.classList.contains('mobile-open') ? 'true' : 'false');
  } else {
    sidebar.classList.toggle('collapsed');
    if (collapseBtn) collapseBtn.setAttribute('aria-expanded', sidebar.classList.contains('collapsed') ? 'false' : 'true');
  }
}
function toggleMobileSidebar(){
  sidebar.classList.toggle('mobile-open');
  document.getElementById('mobileBackdrop').classList.toggle('active');
  var hamburger = document.querySelector('.mobile-hamburger');
  if (hamburger) hamburger.setAttribute('aria-expanded', sidebar.classList.contains('mobile-open') ? 'true' : 'false');
}
window.addEventListener('hashchange', function(){ var h = location.hash.replace('#',''); if (h) navigateTo(h, true); });
window.addEventListener('DOMContentLoaded', function(){
  buildOverview(); rendered.overview = true;
  var h = location.hash.replace('#',''); if (h) navigateTo(h, true);
  var vMeta = document.querySelector('meta[name="version"]');
  if (vMeta) document.getElementById('versionBadge').textContent = 'v' + vMeta.content;
});
</script>
